name: Deploy to Vercel

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  deploy:
    permissions:
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Fail fast if secrets are missing
          test -n "${VERCEL_TOKEN}" || (echo "::error::Missing VERCEL_TOKEN secret" && exit 1)
          test -n "${VERCEL_ORG_ID}" || (echo "::error::Missing VERCEL_ORG_ID secret" && exit 1)
          test -n "${VERCEL_PROJECT_ID}" || (echo "::error::Missing VERCEL_PROJECT_ID secret" && exit 1)

          # Build args with deterministic targeting
          args="--token=${VERCEL_TOKEN} --scope=${VERCEL_ORG_ID} --confirm"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            args="--prod $args"
          fi

          # Deploy and capture output
          out="$(vercel deploy $args 2>&1 | tee /dev/stderr)"
          url="$(echo "$out" | grep -E '^https://' | tail -n 1)"

          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployment ready at: ${{ steps.deploy.outputs.deployment_url }}'
            })
